[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --alluredir=reports/allure-results
    --clean-alluredir
    --reruns=1
    --reruns-delay=2
    --only-rerun=ConnectionError
    --only-rerun=TimeoutError
    --only-rerun=AssertionError.*5\d\d
    -p no:cacheprovider

markers =
    smoke: quick sanity checks (run on every PR)
    regression: full regression suite
    billing: claim/billing endpoints
    eligibility: eligibility/coverage endpoints
    patient: patient demographics endpoints
    payment: payment posting / ERA endpoints
    auth: authentication & token endpoints
    negative: negative / error-path scenarios
    db: requires DB validation hook
    slow: long-running tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s :: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

env =
    D:ENV=qa
    D:LOG_LEVEL=INFO
