name: stage
base_url: https://stage-api.rcm.example.com
auth_url: https://stage-auth.rcm.example.com/oauth/token
timeout_ms: 45000
verify_ssl: true
default_headers:
  Accept: application/json
  Content-Type: application/json
  X-Tenant-Id: stage-tenant
rate_limit_per_sec: 20
retry:
  max_attempts: 3
  backoff_seconds: 2.0
features:
  schema_validation: true
  db_validation: false
