name: prod
base_url: https://api.rcm.example.com
auth_url: https://auth.rcm.example.com/oauth/token
timeout_ms: 45000
verify_ssl: true
default_headers:
  Accept: application/json
  Content-Type: application/json
rate_limit_per_sec: 5
retry:
  max_attempts: 2
  backoff_seconds: 3.0
features:
  schema_validation: true
  db_validation: false  # never hit prod DB from tests
