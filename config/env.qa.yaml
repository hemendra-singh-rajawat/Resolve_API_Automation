name: qa
base_url: https://qa-api.rcm.example.com
auth_url: https://qa-auth.rcm.example.com/oauth/token
timeout_ms: 30000
verify_ssl: true
default_headers:
  Accept: application/json
  Content-Type: application/json
  X-Tenant-Id: qa-tenant
rate_limit_per_sec: 10
retry:
  max_attempts: 3
  backoff_seconds: 1.5
features:
  schema_validation: true
  db_validation: true
