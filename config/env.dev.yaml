name: dev
base_url: http://localhost:8006
# auth_url is unused when AUTH_MODE=jwt_static (default for billing-rcm-service local dev).
auth_url: http://localhost:8006/_unused_oauth
timeout_ms: 30000
verify_ssl: false
default_headers:
  Accept: application/json
  Content-Type: application/json
rate_limit_per_sec: 20
retry:
  max_attempts: 3
  backoff_seconds: 1.5
features:
  schema_validation: true
  db_validation: false
